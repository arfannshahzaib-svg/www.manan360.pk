<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Token Verification - Manan360.pk</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#061a40,#0077b6,#00b4d8);
padding:20px;
}
.box{
background:white;
width:100%;
max-width:390px;
padding:30px 25px;
border-radius:24px;
text-align:center;
box-shadow:0 15px 50px #0005;
}
h1{font-size:25px}
p{color:#777;line-height:1.6}
input{
width:100%;
height:52px;
margin:20px 0 15px;
padding:0 15px;
border:2px solid #ddd;
border-radius:12px;
font-size:18px;
text-align:center;
letter-spacing:2px;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#0077b6,#00b4d8);
color:white;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<div class="box">

<h1>🔐 Token Verification</h1>

<p>Enter your 10-digit token number.</p>

<form action="application.html" method="get">

<input
type="text"
name="token"
inputmode="numeric"
pattern="[0-9]{10}"
maxlength="10"
placeholder="Enter Token"
required>

<button type="submit">
Verify Token
</button>

</form>

</div>

</body>
</html>
