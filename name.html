<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Welcome - Manan360.pk</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#061a40,#0077b6,#00b4d8);
padding:20px;
}
.box{
background:white;
width:100%;
max-width:390px;
padding:30px 25px;
border-radius:24px;
text-align:center;
box-shadow:0 15px 50px #0005;
}
h1{margin-bottom:10px}
p{color:#777;margin-bottom:25px}
input{
width:100%;
height:50px;
border:2px solid #ddd;
border-radius:12px;
padding:0 15px;
font-size:15px;
margin-bottom:15px;
}
button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#0077b6,#00b4d8);
color:white;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<div class="box">

<h1>What is your name?</h1>

<p>Please enter your name to continue.</p>

<form action="home.html" method="get">

<input
type="text"
name="name"
placeholder="Enter your name"
required
maxlength="40">

<button type="submit">
Continue
</button>

</form>

</div>

</body>
</html>
