<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Home - Manan360.pk</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
min-height:100vh;
background:linear-gradient(135deg,#061a40,#0077b6,#00b4d8);
padding:20px;
}
.container{
max-width:900px;
margin:auto;
}
header{

border-radius:18px;
padding:20px;

padding:30px 20px;

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}
.card{
background:white;
padding:25px 18px;
border-radius:18px;
text-align:center;
}
.card h2{margin:10px 0}
.card p{color:#777}
.btn{
display:block;
text-decoration:none;
background:linear-gradient(90deg,#0077b6,#00b4d8);
color:white;
padding:13px;
border-radius:11px;
font-weight:bold;
margin-top:15px;
}
@media(max-width:600px){
.cards{grid-template-columns:1fr}
}
</style>
</head>
