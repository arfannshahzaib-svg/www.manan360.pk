
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 روپے Cashback - Manan360.pk</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .cashback {
      font-size: 38px;
      font-weight: bold;
      margin: 15px 0;
      color: #0a8f45;
    }

    .info {
      background: #eef8f2;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .timer {
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
      color: #222;
    }

    .timer.done {
      color: #0a8f45;
    }

    label {
      display: block;
      text-align: right;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #0a8f45;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      background: #0a8f45;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.6;
    }

    .success {
      display: block;
      background: #e8f8ee;
      color: #087a3b;
    }

    .error {
      display: block;
      background: #ffecec;
      color: #b00020;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <!-- اگر آپ کے logo کا نام مختلف ہے تو یہاں تبدیل کریں -->
    <img src="logo.png" class="logo" alt="Manan360 Logo">

    <h1>Manan360.pk</h1>

    <div class="cashback">
      Rs. 100 Cashback
    </div>

    <div class="info">
      ویب سائٹ پر کم از کم <b>1 منٹ</b> رہیں۔<br>
      ایک منٹ مکمل ہونے کے بعد Cashback فارم مکمل کریں۔
    </div>

    <div id="timer" class="timer">
      01:00
    </div>

    <form id="cashbackForm">

      <label for="name">آپ کا نام</label>
      <input
        type="text"
        id="name"
        placeholder="اپنا نام لکھیں"
        required
      >

      <label for="method">Payment Method</label>
      <select id="method" required>
        <option value="">منتخب کریں</option>
        <option value="Easypaisa">Easypaisa</option>
        <option value="JazzCash">JazzCash</option>
      </select>

      <label for="account">
        Easypaisa / JazzCash نمبر
      </label>

      <input
        type="tel"
        id="account"
        placeholder="03XXXXXXXXX"
        maxlength="11"
        required
      >

      <button
        type="submit"
        id="claimButton"
        disabled
      >
        1 منٹ مکمل ہونے کا انتظار کریں
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="small">
      نوٹ: Cashback کی ادائیگی آپ کی تصدیق کے بعد کی جائے گی۔
      ایک شخص کو صرف ایک Cashback دیا جائے گا۔
    </div>

  </div>
</div>


<script>

  // ==========================
  // 1 MINUTE TIMER
  // ==========================

  let timeLeft = 60;

  const timer = document.getElementById("timer");
  const claimButton = document.getElementById("claimButton");

  const countdown = setInterval(function() {

    timeLeft--;

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    minutes = String(minutes).padStart(2, "0");
    seconds = String(seconds).padStart(2, "0");

    timer.textContent = minutes + ":" + seconds;

    if (timeLeft <= 0) {

      clearInterval(countdown);

      timer.textContent = "00:00";
      timer.classList.add("done");

      claimButton.disabled = false;
      claimButton.textContent = "100 روپے Cashback Claim کریں";
    }

  }, 1000);


  // ==========================
  // FORM SUBMISSION
  // ==========================

  document.getElementById("cashbackForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const method = document.getElementById("method").value;
    const account = document.getElementById("account").value.trim();

    const message = document.getElementById("message");

    // Name check
    if (name.length < 2) {
      message.textContent = "براہِ کرم اپنا درست نام لکھیں۔";
      message.className = "message error";
      return;
    }

    // Payment method check
    if (method === "") {
      message.textContent = "براہِ کرم Easypaisa یا JazzCash منتخب کریں۔";
      message.className = "message error";
      return;
    }

    // Pakistani mobile number check
    const phonePattern = /^03[0-9]{9}$/;

    if (!phonePattern.test(account)) {
      message.textContent =
        "براہِ کرم 11 ہندسوں کا درست موبائل نمبر لکھیں، مثلاً 03XXXXXXXXX";
      message.className = "message error";
      return;
    }

    // Success message
    message.innerHTML =
      "<b>آپ کی Cashback درخواست موصول ہو گئی ہے۔</b><br>" +
      "نام: " + escapeHTML(name) + "<br>" +
      "Payment Method: " + escapeHTML(method) + "<br>" +
      "آپ کی درخواست تصدیق کے بعد process کی جائے گی۔";

    message.className = "message success";

    // Button disable
    claimButton.disabled = true;
    claimButton.textContent = "Request Submitted";

  });


  // ==========================
  // SECURITY HELPER
  // ==========================

  function escapeHTML(text) {

    const div = document.createElement("div");
    div.textContent = text;

    return div.innerHTML;
  }

</script>

</body>
</html>
