<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manan360 - Rs.100 Cashback</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

.container{
  max-width:500px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h1{
  text-align:center;
}

.cashback{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin:15px 0;
}

.timer{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin:20px 0;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  font-size:17px;
}

button:disabled{
  background:#999;
}

#message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Manan360</h1>

<div class="cashback">Rs.100 Cashback</div>

<p style="text-align:center;">
Cashback request کے لیے 1 منٹ مکمل کریں۔
</p>

<div class="timer" id="timer">01:00</div>

<form id="cashbackForm">

<label>Account Name</label>
<input
  type="text"
  id="accountName"
  placeholder="Account holder name"
  required
>

<label>Payment Method</label>
<select id="paymentMethod" required>
  <option value="">Select payment method</option>
  <option value="EasyPaisa">EasyPaisa</option>
  <option value="JazzCash">JazzCash</option>
</select>

<label>Account Number</label>
<input
  type="tel"
  id="accountNumber"
  placeholder="EasyPaisa / JazzCash number"
  required
>

<button id="submitBtn" type="submit" disabled>
Wait 1 Minute
</button>

</form>

<div id="message"></div>

</div>
</div>

<script>

let seconds = 60;

const timer = document.getElementById("timer");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

const countdown = setInterval(function(){

  seconds--;

  let minutes = Math.floor(seconds / 60);
  let secs = seconds % 60;

  timer.textContent =
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0");

  if(seconds <= 0){

    clearInterval(countdown);

    timer.textContent = "00:00";

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Cashback Request";
  }

},1000);


document.getElementById("cashbackForm").addEventListener("submit",function(e){

  e.preventDefault();

  const accountName =
    document.getElementById("accountName").value.trim();

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  const accountNumber =
    document.getElementById("accountNumber").value.trim();

  if(!accountName || !paymentMethod || !accountNumber){
    message.textContent = "Please complete all fields.";
    return;
  }

  message.textContent =
    "Your Cashback request has been submitted successfully.";

  this.reset();

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitted";

});

</script>

</body>
</html>
