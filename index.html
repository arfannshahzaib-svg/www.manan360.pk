<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#061a40,#0077b6,#00b4d8);
    color:#222;
}
.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.box{
    width:100%;
    max-width:390px;
    background:white;
    border-radius:24px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 15px 50px #0005;
}
.logo{
    width:70px;height:70px;
    margin:auto auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0077b6,#00b4d8);
    color:white;
    font-size:28px;
    font-weight:bold;
}
h1{font-size:27px;margin-bottom:7px}
.sub{color:#777;margin-bottom:25px;font-size:14px}
input{
    width:100%;
    height:50px;
    margin-bottom:15px;
    padding:0 15px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:15px;
}
.btn{
    display:block;
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#0077b6,#00b4d8);
    color:white;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}
.info{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#eef8ff;
    color:#145;
    font-size:13px;
    line-height:1.6;
}
</style>
</head>

<body>

<section class="page">
<div class="box">

<div class="logo">M</div>

<h1>Manan360.pk</h1>

<div class="sub">Student Login Portal</div>

<!-- HTML-ONLY DEMO LOGIN -->
<form action="name.html" method="get">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button class="btn" type="submit">
Login
</button>

</form>

<div class="info">
Enter your registered username and password to continue.
</div>

</div>
</section>

</body>
</html>
