<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#061a40,#0072ff,#00c853);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#fff;
padding:28px 22px;
border-radius:25px;
box-shadow:0 15px 40px #0005;
text-align:center;
}

.logo{
width:95px;
height:95px;
object-fit:contain;
border-radius:20px;
margin-bottom:10px;
}

h1{color:#073b8f;margin-bottom:6px}
p{color:#666;margin-bottom:20px}

input{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,#0066ff,#00aaff);
color:white;
font-size:16px;
font-weight:bold;
}

.hidden{display:none}

.msg{
margin-top:14px;
padding:12px;
border-radius:10px;
font-weight:bold;
}

.err{background:#ffe7e7;color:#c00}
.ok{background:#e5ffed;color:#08752b}

.token-list{
max-height:220px;
overflow:auto;
text-align:left;
background:#f5f8ff;
padding:10px;
border-radius:10px;
margin-top:15px;
font-size:13px;
}

.token-list div{
padding:5px;
border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">

<img src="logo.png" class="logo" alt="Manan360.pk">

<h1>Manan360.pk</h1>
<p>Notes & Test Papers</p>

<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginMsg"></div>

</div>


<!-- TOKEN PAGE -->
<div class="box hidden" id="tokenBox">

<img src="logo.png" class="logo" alt="Manan360.pk">

<h1>Manan360.pk</h1>
<p>Token Verification</p>

<input
id="token"
type="text"
inputmode="numeric"
maxlength="10"
placeholder="Enter Token Number">

<button onclick="verifyToken()">Verify Token</button>

<div id="tokenMsg"></div>

<button onclick="showTokens()">View 500 Token Numbers</button>

<div id="tokenList" class="token-list hidden"></div>

</div>


<script>

/* =========================
   LOGIN DETAILS
========================= */

const PASSWORD = "Abdul Manan0088";

const USERS = [
"Karor Lal Esson",
"Fathehpur",
"Layyah",
"Chowk Azam",
"Chowk Munda"
];


/* =========================
   LOGIN
========================= */

function login(){

const user =
document.getElementById("username").value.trim();

const pass =
document.getElementById("password").value;

const msg =
document.getElementById("loginMsg");

if(
USERS.some(
x => x.toLowerCase() === user.toLowerCase()
)
&& pass === PASSWORD
){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("tokenBox")
.classList.remove("hidden");

msg.innerHTML="";

}else{

msg.innerHTML =
'<div class="msg err">Username یا Password غلط ہے۔</div>';

}

}


/* =========================
   500 TOKENS
========================= */

const SPECIAL_TOKEN = "7842306159";

const TOKENS = new Set();

TOKENS.add(SPECIAL_TOKEN);


/*
  باقی 499 نمبر
  10 digit unique tokens
*/

let n = 1000000000;

while(TOKENS.size < 500){

let token = String(n);

if(token !== SPECIAL_TOKEN){
TOKENS.add(token);
}

n++;

}

const TOKEN_ARRAY = [...TOKENS];


/* =========================
   VERIFY TOKEN
========================= */

function verifyToken(){

const value =
document.getElementById("token").value.trim();

const msg =
document.getElementById("tokenMsg");

if(!/^\d{10}$/.test(value)){

msg.innerHTML =
'<div class="msg err">10 ہندسوں کا Token Number لکھیں۔</div>';

return;
}


if(!TOKENS.has(value)){

msg.innerHTML =
'<div class="msg err">یہ Token Number درست نہیں ہے۔</div>';

return;
}


/* SPECIAL TOKEN */

if(value === SPECIAL_TOKEN){

if(localStorage.getItem("special_token_used")==="yes"){

msg.innerHTML =
'<div class="msg err">یہ خاص Token پہلے استعمال ہو چکا ہے۔</div>';

return;

}

localStorage.setItem("special_token_used","yes");

msg.innerHTML =
'<div class="msg ok">✓ Token Verified<br>Rs.100 Cashback Successful</div>';

return;

}


/* OTHER TOKENS */

msg.innerHTML =
'<div class="msg ok">✓ Token Verified Successfully</div>';

}


/* =========================
   SHOW 500 TOKENS
========================= */

function showTokens(){

const box =
document.getElementById("tokenList");

box.classList.toggle("hidden");

if(!box.innerHTML){

let html="";

TOKEN_ARRAY.forEach((token,i)=>{

html +=
"<div>"+(i+1)+". "+token+"</div>";

});

box.innerHTML=html;

}

}

</script>

</body>
</html>
