<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 font-family:Arial,sans-serif;
 min-height:100vh;
 background:linear-gradient(135deg,#061a40,#0072ff,#00c853);
 padding:20px;
}

.container{
 max-width:480px;
 margin:auto;
}

.card{
 background:#fff;
 border-radius:25px;
 padding:22px;
 margin-bottom:18px;
 box-shadow:0 15px 40px rgba(0,0,0,.25);
 text-align:center;
}

.logo{
 width:90px;
 height:90px;
 object-fit:contain;
 border-radius:20px;
}

h1{
 color:#073b8f;
 margin:8px 0 4px;
}

.subtitle{
 color:#666;
 margin-bottom:18px;
}

input{
 width:100%;
 padding:14px;
 margin:6px 0;
 border:1px solid #ddd;
 border-radius:12px;
 font-size:16px;
 outline:none;
}

button{
 width:100%;
 padding:14px;
 margin-top:9px;
 border:0;
 border-radius:12px;
 color:white;
 font-size:16px;
 font-weight:bold;
 background:linear-gradient(90deg,#0066ff,#00b7ff);
}

.home{
 display:none;
}

.welcome{
 background:linear-gradient(135deg,#0066ff,#00c853);
 color:white;
 padding:18px;
 border-radius:17px;
 margin-bottom:15px;
}

.welcome h2{
 margin-bottom:5px;
}

.token-title{
 color:#073b8f;
 font-size:22px;
 font-weight:bold;
 margin-bottom:5px;
}

.token-sub{
 color:#777;
 margin-bottom:15px;
}

.msg{
 margin-top:12px;
 padding:12px;
 border-radius:10px;
 font-weight:bold;
}

.error{
 background:#ffe7e7;
 color:#c00000;
}

.success{
 background:#e5ffed;
 color:#08752b;
}

.balance{
 margin-top:15px;
 padding:14px;
 border-radius:14px;
 background:#eef6ff;
 color:#0758b8;
 font-size:20px;
 font-weight:bold;
}

.logout{
 background:#555;
 margin-top:18px;
 font-size:14px;
 padding:10px;
}

.small{
 color:#888;
 font-size:12px;
 margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div class="card" id="loginPage">

<img src="logo.png" class="logo">

<h1>Manan360.pk</h1>
<div class="subtitle">Notes & Test Papers</div>

<input
 id="username"
 type="text"
 placeholder="Username">

<input
 id="password"
 type="password"
 placeholder="Password">

<button onclick="login()">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ================= HOME ================= -->

<div class="home" id="homePage">

<div class="card">

<img src="logo.png" class="logo">

<h1>Manan360.pk</h1>

<div class="welcome">
<h2 id="welcomeName">Welcome</h2>
<div>Welcome to Manan360.pk</div>
</div>

</div>


<!-- ================= TOKEN + HOME MERGED ================= -->

<div class="card">

<div class="token-title">
Verified Token
</div>

<div class="token-sub">
Enter your 10 digit token number
</div>

<input
 id="tokenInput"
 type="text"
 inputmode="numeric"
 maxlength="10"
 placeholder="Enter Token Number">

<button onclick="verifyToken()">
Verify Token
</button>

<div id="tokenMessage"></div>

<div class="balance">
Cashback: Rs.100
</div>

<div class="small">
Special cashback token: 7842306159
</div>

</div>


<!-- ================= HOME CONTENT ================= -->

<div class="card">

<h2 style="color:#073b8f;margin-bottom:12px;">
Student Portal
</h2>

<button onclick="alert('Class 9 Notes coming soon')">
Class 9th Notes
</button>

<button onclick="alert('Class 10 Notes coming soon')">
Class 10th Notes
</button>

<button onclick="alert('Test Papers coming soon')">
Test Papers
</button>

<button class="logout" onclick="logout()">
Sign Out
</button>

</div>

</div>

</div>


<script>

/* =========================
   LOGIN USERS
========================= */

const PASSWORD = "Abdul Manan0088";

const USERS = [
"Karor Lal Esson",
"Fathehpur",
"Layyah",
"Chowk Azam",
"Chowk Munda"
];


/* =========================
   500 UNIQUE TOKENS
========================= */

const SPECIAL_TOKEN = "7842306159";

const TOKENS = new Set();

TOKENS.add(SPECIAL_TOKEN);

let number = 1000000000;

while(TOKENS.size < 500){

 let token = String(number);

 if(token !== SPECIAL_TOKEN){
   TOKENS.add(token);
 }

 number++;
}

const TOKEN_LIST = [...TOKENS];


/* =========================
   LOGIN
========================= */

function login(){

 const username =
 document.getElementById("username").value.trim();

 const password =
 document.getElementById("password").value;

 const message =
 document.getElementById("loginMessage");

 const userFound = USERS.some(
   user =>
   user.toLowerCase() === username.toLowerCase()
 );

 if(userFound && password === PASSWORD){

   document.getElementById("loginPage")
   .style.display="none";

   document.getElementById("homePage")
   .style.display="block";

   document.getElementById("welcomeName")
   .innerText="Hello, "+username;

 }else{

   message.innerHTML=
   '<div class="msg error">Username یا Password غلط ہے۔</div>';

 }

}


/* =========================
   TOKEN VERIFY
========================= */

function verifyToken(){

 const token =
 document.getElementById("tokenInput").value.trim();

 const message =
 document.getElementById("tokenMessage");


 if(!/^\d{10}$/.test(token)){

   message.innerHTML=
   '<div class="msg error">براہِ کرم 10 ہندسوں کا Token لکھیں۔</div>';

   return;
 }


 if(!TOKENS.includes(token)){

   message.innerHTML=
   '<div class="msg error">Invalid Token Number</div>';

   return;
 }


 /* SPECIAL TOKEN */

 if(token === SPECIAL_TOKEN){

   if(
   localStorage.getItem("manan_special_used")
   === "yes"
   ){

     message.innerHTML=
     '<div class="msg error">یہ Token پہلے استعمال ہو چکا ہے۔</div>';

     return;
   }

   localStorage.setItem(
   "manan_special_used",
   "yes"
   );

   message.innerHTML=
   '<div class="msg success">' +
   '✓ Token Verified Successfully<br>' +
   'Rs.100 Cashback Successful' +
   '</div>';

   return;
 }


 /* OTHER 499 TOKENS */

 message.innerHTML=
 '<div class="msg success">' +
 '✓ Token Verified Successfully' +
 '</div>';

}


/* =========================
   LOGOUT
========================= */

function logout(){

 document.getElementById("homePage")
 .style.display="none";

 document.getElementById("loginPage")
 .style.display="block";

 document.getElementById("username").value="";
 document.getElementById("password").value="";
 document.getElementById("tokenInput").value="";
 document.getElementById("tokenMessage").innerHTML="";
 document.getElementById("loginMessage").innerHTML="";

}

</script>

</body>
</html>
