<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#061a40,#007bff,#00b894);
}

.page{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:28px 22px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1,h2{
  color:#064b91;
  margin-bottom:12px;
}

p{
  color:#555;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:15px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:12px;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#087bea;
  margin-top:8px;
  cursor:pointer;
}

.cancel{
  background:#777;
}

.signout{
  background:#444;
  margin-top:18px;
}

.book{
  padding:18px;
  border:1px solid #ddd;
  border-radius:15px;
  margin:12px 0;
  background:#f5faff;
}

.book h3{
  color:#07549b;
  margin-bottom:7px;
}

.error{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#ffe8e8;
  color:#c62828;
  font-weight:bold;
}

.success{
  padding:20px;
  border-radius:15px;
  background:#e9fff2;
  color:#087443;
}

.tick{
  font-size:90px;
  color:#08a65a;
  font-weight:bold;
  line-height:1;
  margin-bottom:15px;
}

.message{
  font-size:18px;
  font-weight:bold;
  line-height:1.7;
}

.home{
  background:#00a86b;
  margin-top:22px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="page" id="loginPage">
<div class="box">

<h1>Manan360.pk</h1>
<p>Login to continue</p>

<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginError"></div>

</div>
</div>


<!-- NAME -->
<div class="page" id="namePage">
<div class="box">

<h2>Welcome</h2>
<p>What is your name?</p>

<input id="visitorName" type="text" placeholder="Enter your name">

<button onclick="saveName()">Continue</button>

</div>
</div>


<!-- BOOKS -->
<div class="page" id="booksPage">
<div class="box">

<h2 id="welcomeText">Books</h2>

<div class="book">
<h3>Class 9th Notes</h3>
<p>Study Notes</p>
<button onclick="openToken()">Open Book</button>
</div>

<div class="book">
<h3>Class 10th Notes</h3>
<p>Study Notes</p>
<button onclick="openToken()">Open Book</button>
</div>

<button class="signout" onclick="signOut()">Sign Out</button>

</div>
</div>


<!-- TOKEN -->
<div class="page" id="tokenPage">
<div class="box">

<h2>Token Number</h2>
<p>Enter your token number</p>

<input
id="token"
type="text"
inputmode="numeric"
maxlength="10"
placeholder="Enter Token Number">

<button onclick="verifyToken()">Verify Token</button>

<button class="cancel" onclick="cancelToken()">Cancel</button>

<div id="tokenMessage"></div>

<button class="signout" onclick="signOut()">Sign Out</button>

</div>
</div>


<!-- SUCCESS -->
<div class="page" id="successPage">
<div class="box">

<div class="tick">✓</div>

<div class="success">
<div class="message">
آپ کی درخواست سبمٹ ہو چکی ہے۔<br>
براہ کرم انتظار کریں۔
</div>
</div>

<button class="home" onclick="goHome()">Home</button>

</div>
</div>


<script>

/* LOGIN */
const USERNAME = "admin1234";
const PASSWORD = "admin";


/* 500 UNIQUE TOKENS */
const validTokens = new Set();

/* مخصوص token */
validTokens.add("7842306159");

/* باقی 499 tokens */
for(let i=6001; i<=6499; i++){
    validTokens.add("784230" + i);
}


/* PAGE */
function showPage(id){

    document.querySelectorAll(".page").forEach(function(page){
        page.style.display="none";
    });

    document.getElementById(id).style.display="flex";
}


/* LOGIN */
function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if(username === USERNAME && password === PASSWORD){

        document.getElementById("loginError").innerHTML="";
        showPage("namePage");

    }else{

        document.getElementById("loginError").innerHTML=
        '<div class="error">Invalid username or password.</div>';

    }
}


/* NAME */
function saveName(){

    const name =
        document.getElementById("visitorName").value.trim();

    if(name===""){
        alert("Please enter your name.");
        return;
    }

    document.getElementById("welcomeText").innerText=
        "Hello, " + name;

    showPage("booksPage");
}


/* BOOK */
function openToken(){

    document.getElementById("token").value="";
    document.getElementById("tokenMessage").innerHTML="";

    showPage("tokenPage");
}


/* TOKEN */
function verifyToken(){

    const token =
        document.getElementById("token").value.trim();

    const message =
        document.getElementById("tokenMessage");

    if(token===""){

        message.innerHTML=
        '<div class="error">Please enter your token number.</div>';

        return;
    }

    if(validTokens.has(token)){

        showPage("successPage");

    }else{

        message.innerHTML=
        '<div class="error">Invalid Token Number</div>';

    }
}


/* CANCEL */
function cancelToken(){

    document.getElementById("token").value="";
    document.getElementById("tokenMessage").innerHTML="";

    showPage("booksPage");
}


/* HOME */
function goHome(){

    showPage("booksPage");
}


/* SIGN OUT */
function signOut(){

    document.getElementById("username").value="";
    document.getElementById("password").value="";
    document.getElementById("visitorName").value="";
    document.getElementById("token").value="";

    showPage("loginPage");
}


/* START */
showPage("loginPage");

</script>

</body>
</html>
