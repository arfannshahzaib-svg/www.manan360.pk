<!DOCTYPE html>

<head>

<title>Manan360.pk - Study Portal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    color: #222;

header {
    background: #1769aa;
    color: white;

    padding: 20px;
}

header h1 {

}

.container {

    margin: 25px auto;

}

.card {
    background: white;

    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

.login-box {
    max-width: 420px;

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;

    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    background: #1769aa;

}

button:hover {

}

.biometric {
    background: #7c3aed;
}

.biometric:hover {
    background: #5b21b6;
}

.register {
    background: #16a34a;
}

.register:hover {
    background: #15803d;
}

.section-title {
    color: #1769aa;
    border-bottom: 2px solid #1769aa;
    padding-bottom: 8px;
}

.file-box {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin: 12px 0;
}

.file-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.file-buttons a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 11px;
    border-radius: 7px;
    color: white;
    background: #1769aa;
}

.file-buttons a.download {
    background: #16833b;
}

.logout {
    background: #c62828;
}

#error {
    color: red;
    text-align: center;
    margin-top: 10px;
}

#bioStatus {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
}

#website {
    display: none;
}

.cashback-button {
    display: block;
    background: #16a34a;
    color: white;
    padding: 15px;
    margin: 20px 0;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
}

.cashback-button:hover {
    background: #15803d;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

    <header>
        <h1>Manan360.pk</h1>
        <p>Student Login</p>
    </header>

    <div class="login-box card">

        <h2>🔐 Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <button
            class="register"
            onclick="registerBiometric()">
            👆 Register Fingerprint / Face
        </button>

        <button
            class="biometric"
            onclick="biometricLogin()">
            🔐 Fingerprint / Face Login
        </button>

        <p id="error"></p>
        <p id="bioStatus"></p>

    </div>

</div>


<!-- WEBSITE -->
<div id="website">

<header>

</header>

<div class="container">

    <div class="card">

        <h2>📚 Welcome</h2>

        <p>
            اپنی Class منتخب کریں اور Notes / Test Papers کھولیں۔
        </p>

        <button class="logout" onclick="logout()">

    <!-- CASHBACK -->

        class="cashback-button"
        target="_blank">
        💰 Rs.100 Cashback

    <!-- CLASS 9TH -->
    <div class="card">

        <h2 class="section-title">

        </h2>

        <div class="file-box">

            <h3>
                📄 Class 9th Urdu Test Paper
            </h3>

            <div class="file-buttons">

                <a
                    href="Class-9th-Urdu-Test-Paper.pdf"
                    target="_blank">
                    Open File
                </a>

                <a
                    class="download"

                    download>

    <!-- CLASS 10TH -->
    <div class="card">

        <h2 class="section-title">
            📖 Class 10th
        </h2>

        <div class="file-box">

            <h3>
                📄 Class 10th Test Paper
            </h3>

            <div class="file-buttons">

                <a
                    href="Class-10th-Test-Paper.pdf"
                    target="_blank">
                    Open File
                </a>

                <a
                    class="download"
                    href="Class-10th-Test-Paper.pdf"
                    download>
                    Download
                </a>

            </div>

        </div>

    </div>

</div>

</div>


<script>

/* Users */
const users = [
    "322202990",
    "322202440",
    "322505434",
    "327589969",
    "359953999"
];

/* Common Password */
const commonPassword = "1999908774";


/* =========================
   NORMAL LOGIN
========================= */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (
        users.includes(username) &&
        password === commonPassword
    ) {

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("website").style.display = "block";

    } else {

        document.getElementById("error").innerText =
            "Username یا Password غلط ہے۔";
    }
}


/* =========================
   CHECK BIOMETRIC SUPPORT
========================= */

function biometricSupported() {

    return (
        window.PublicKeyCredential &&
        typeof window.PublicKeyCredential === "function"
    );
}


/* =========================
   REGISTER FINGERPRINT / FACE
========================= */

async function registerBiometric() {

    const username =
        document.getElementById("username").value.trim();

    if (!users.includes(username)) {

        document.getElementById("bioStatus").innerText =
            "پہلے درست Username لکھیں۔";

        return;
    }

    if (!biometricSupported()) {

        document.getElementById("bioStatus").innerText =
            "اس device/browser میں biometric verification دستیاب نہیں۔";

        return;
    }

    try {

        const challenge = crypto.getRandomValues(
            new Uint8Array(32)
        );

        const userId = crypto.getRandomValues(
            new Uint8Array(16)
        );

        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge: challenge,

                    rp: {
                        name: "Manan360.pk"
                    },

                    user: {

                        id: userId,

                        name: username,

                        displayName: username
                    },

                    pubKeyCredParams: [

                        {
                            type: "public-key",
                            alg: -7
                        },

                        {
                            type: "public-key",
                            alg: -257
                        }

                    ],

                    authenticatorSelection: {

                        authenticatorAttachment: "platform",

                        userVerification: "required"
                    },

                    timeout: 60000,

                    attestation: "none"
                }

            });


        if (credential) {

            const credentialId =
                arrayBufferToBase64(
                    credential.rawId
                );

            localStorage.setItem(
                "manan360_biometric_" + username,
                credentialId
            );

            document.getElementById("bioStatus").innerText =
                "✅ Fingerprint / Face کامیابی سے register ہوگیا۔";

        }

    } catch (error) {

        document.getElementById("bioStatus").innerText =
            "❌ Biometric registration مکمل نہیں ہو سکی۔";

        console.log(error);
    }
}


/* =========================
   BIOMETRIC LOGIN
========================= */

async function biometricLogin() {

    const username =
        document.getElementById("username").value.trim();

    if (!users.includes(username)) {

        document.getElementById("bioStatus").innerText =
            "پہلے اپنا Username لکھیں۔";

        return;
    }

    const savedCredential =
        localStorage.getItem(
            "manan360_biometric_" + username
        );

    if (!savedCredential) {

        document.getElementById("bioStatus").innerText =
            "اس Username کے لیے پہلے Fingerprint / Face register کریں۔";

        return;
    }

    if (!biometricSupported()) {

        document.getElementById("bioStatus").innerText =
            "اس device/browser میں biometric verification دستیاب نہیں۔";

        return;
    }

    try {

        const credentialId =
            base64ToArrayBuffer(savedCredential);

        const challenge = crypto.getRandomValues(
            new Uint8Array(32)
        );

        const credential =
            await navigator.credentials.get({

                publicKey: {

                    challenge: challenge,

                    allowCredentials: [

                        {
                            type: "public-key",
                            id: credentialId
                        }

                    ],

                    userVerification: "required",

                    timeout: 60000
                }

            });


        if (credential) {

            document.getElementById("loginPage").style.display =
                "none";

            document.getElementById("website").style.display =
                "block";

            document.getElementById("bioStatus").innerText =
                "";

        }

    } catch (error) {

        document.getElementById("bioStatus").innerText =
            "❌ Fingerprint / Face verification ناکام ہوئی۔";

        console.log(error);
    }
}


/* =========================
   CONVERT FUNCTIONS
========================= */

function arrayBufferToBase64(buffer) {

    let binary = "";

    const bytes =
        new Uint8Array(buffer);

    for (let i = 0; i < bytes.byteLength; i++) {

        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}


function base64ToArrayBuffer(base64) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes.buffer;
}


/* =========================
   LOGOUT
========================= */

function logout() {

    document.getElementById("website").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "block";

    document.getElementById("username").value =
        "";

    document.getElementById("password").value =
        "";

    document.getElementById("error").innerText =
        "";

    document.getElementById("bioStatus").innerText =
        "";
}

</script>

</body>
