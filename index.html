<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Token Application</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#061a40,#007bff,#00b894);
  padding:20px;
}

.box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:22px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
  color:#063b78;
  margin-bottom:10px;
}

p{
  color:#555;
  margin-bottom:22px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:17px;
  outline:none;
  margin-bottom:14px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#007bff,#00a86b);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#result{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:14px;
  background:#e9fff3;
  color:#087443;
  font-weight:bold;
  line-height:1.6;
}

.error{
  background:#ffecec !important;
  color:#c62828 !important;
}
</style>
</head>

<body>

<div class="box">

  <h1>Token Application</h1>

  <p>Enter your token number</p>

  <input
    type="text"
    id="token"
    inputmode="numeric"
    maxlength="10"
    placeholder="Enter Token Number"
  >

  <button onclick="submitToken()">Submit</button>

  <div id="result"></div>

</div>

<script>

/* 500 unique test tokens */
const tokens = [

"7842306159",

"7842306001","7842306002","7842306003","7842306004","7842306005",
"7842306006","7842306007","7842306008","7842306009","7842306010",
"7842306011","7842306012","7842306013","7842306014","7842306015",
"7842306016","7842306017","7842306018","7842306019","7842306020",
"7842306021","7842306022","7842306023","7842306024","7842306025",
"7842306026","7842306027","7842306028","7842306029","7842306030",
"7842306031","7842306032","7842306033","7842306034","7842306035",
"7842306036","7842306037","7842306038","7842306039","7842306040",
"7842306041","7842306042","7842306043","7842306044","7842306045",
"7842306046","7842306047","7842306048","7842306049","7842306050",

"7842306051","7842306052","7842306053","7842306054","7842306055",

"7842306061","7842306062","7842306063","7842306064","7842306065",
"7842306066","7842306067","7842306068","7842306069","7842306070",

"7842306076","7842306077","7842306078","7842306079","7842306080",
"7842306081","7842306082","7842306083","7842306084","7842306085",
"7842306086","7842306087","7842306088","7842306089","7842306090",
"7842306091","7842306092","7842306093","7842306094","7842306095",
"7842306096","7842306097","7842306098","7842306099","7842306100"

];

/* باقی tokens خود generate ہوں گے تاکہ کل 500 ہوں */
for(let i=6101;i<=6599;i++){
  tokens.push("784230" + String(i).padStart(4,"0"));
}

/* 500 unique tokens */
const validTokens = new Set(tokens.slice(0,500));

function submitToken(){

  const input = document.getElementById("token");
  const result = document.getElementById("result");

  const token = input.value.trim();

  result.classList.remove("error");

  if(token === ""){
    result.style.display = "block";
    result.classList.add("error");
    result.innerHTML = "Please enter your token number.";
    return;
  }

  if(validTokens.has(token)){

    result.style.display = "block";

    result.innerHTML =
      "Application Submitted, please wait.<br><br>" +
      "Status: Answered";

  }else{

    result.style.display = "block";
    result.classList.add("error");

    result.innerHTML =
      "Invalid Token.<br>Please check your token number.";

  }
}

</script>

</body>
</html>
