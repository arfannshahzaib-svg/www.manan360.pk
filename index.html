<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#061a40,#0072ff,#00c853);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:25px;
  padding:28px 22px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:20px;
  margin-bottom:10px;
}

h1{
  color:#073b8f;
  margin-bottom:5px;
}

.subtitle{
  color:#666;
  margin-bottom:22px;
}

input,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#0066ff,#00aaff);
}

button:hover{
  opacity:.9;
}

.hidden{
  display:none;
}

.success{
  margin-top:15px;
  padding:14px;
  background:#e8fff0;
  color:#08752b;
  border-radius:12px;
  font-weight:bold;
}

.error{
  margin-top:15px;
  padding:14px;
  background:#ffecec;
  color:#c40000;
  border-radius:12px;
  font-weight:bold;
}

.balance{
  margin:15px 0;
  padding:15px;
  background:#f0f7ff;
  border-radius:15px;
  color:#0758b8;
  font-size:20px;
  font-weight:bold;
}

.tokenInfo{
  margin-top:12px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginPage">

  <img src="logo.png" class="logo" alt="Manan360.pk Logo">

  <h1>Manan360.pk</h1>
  <div class="subtitle">Student Login Portal</div>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="loginMessage"></div>
</div>


<!-- TOKEN / CASHBACK PAGE -->
<div class="card hidden" id="tokenPage">

  <img src="logo.png" class="logo" alt="Manan360.pk Logo">

  <h1>Manan360.pk</h1>
  <div class="subtitle">Token Verification</div>

  <div class="balance">
    Cashback: Rs.100
  </div>

  <input
    type="text"
    id="tokenInput"
    maxlength="10"
    inputmode="numeric"
    placeholder="Enter 10 Digit Token Number"
  >

  <button onclick="verifyToken()">Verify Token</button>

  <div id="tokenMessage"></div>

  <div class="tokenInfo">
    500 unique demo tokens are available.
  </div>

</div>


<script>

/* =====================================================
   MANAN360.PK
   500 UNIQUE TOKEN SYSTEM
   SPECIAL TOKEN = 7842306159
   ===================================================== */


/* SPECIAL TOKEN */
const SPECIAL_TOKEN = "7842306159";


/*
   Fixed seed generator.
   Is se har baar wahi 500 tokens generate honge.
   Random refresh par list change nahi hogi.
*/
let seed = 3602026;

function seededRandom(){
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}


/* TOKEN LIST */
const tokens = new Set();


/* Special token ko sab se pehle add karein */
tokens.add(SPECIAL_TOKEN);


/* Baqi 499 unique tokens */
while(tokens.size < 500){

  let number = Math.floor(
    1000000000 + seededRandom() * 9000000000
  ).toString();

  tokens.add(number);
}


/* Convert Set to Array */
const TOKEN_LIST = Array.from(tokens);


/* =====================================================
   LOGIN
   Apne existing username/password yahan rakh sakte hain.
   ===================================================== */

const USERS = {
  "admin": "1234",
  "manan": "1234",
  "student": "1234"
};


function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");


  if(USERS[username] && USERS[username] === password){

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("tokenPage")
      .classList.remove("hidden");

  }else{

    message.innerHTML =
      '<div class="error">Invalid username or password.</div>';

  }
}


/* =====================================================
   TOKEN VERIFICATION
   ===================================================== */

function verifyToken(){

  const token =
    document.getElementById("tokenInput")
      .value.trim();

  const message =
    document.getElementById("tokenMessage");


  /* Basic check */
  if(!/^\d{10}$/.test(token)){

    message.innerHTML =
      '<div class="error">Please enter a valid 10 digit token.</div>';

    return;
  }


  /* Token available? */
  if(!TOKEN_LIST.includes(token)){

    message.innerHTML =
      '<div class="error">Invalid Token Number.</div>';

    return;
  }


  /*
     Special token:
     7842306159
  */
  if(token === SPECIAL_TOKEN){

    const alreadyUsed =
      localStorage.getItem(
        "manan360_special_token_used"
      );


    if(alreadyUsed === "yes"){

      message.innerHTML =
        '<div class="error">This token has already been used.</div>';

      return;
    }


    localStorage.setItem(
      "manan360_special_token_used",
      "yes"
    );


    message.innerHTML =
      '<div class="success">' +
      '✓ Token Verified Successfully<br>' +
      'Cashback Application Successful<br>' +
      'Cashback: Rs.100' +
      '</div>';

    return;
  }


  /*
     Other 499 tokens:
     Valid token message
  */
  message.innerHTML =
    '<div class="success">' +
    '✓ Token Verified Successfully' +
    '</div>';
}


/* =====================================================
   OPTIONAL:
   Browser console mein 500 tokens dekhne ke liye
   ===================================================== */

console.log("MANAN360.PK - 500 TOKENS");
console.log(TOKEN_LIST);
console.log("SPECIAL TOKEN:", SPECIAL_TOKEN);

</script>

</body>
</html>
