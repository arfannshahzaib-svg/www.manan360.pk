<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#061a40,#007bff,#00b894);
  color:#222;
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:28px 22px;
  border-radius:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  text-align:center;
}

h1{
  color:#064b91;
  margin-bottom:10px;
}

h2{
  color:#064b91;
  margin-bottom:18px;
}

p{
  margin-bottom:20px;
  color:#555;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  margin-bottom:14px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#007bff,#00a86b);
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.book{
  border:1px solid #ddd;
  border-radius:15px;
  padding:18px;
  margin:12px 0;
  background:#f7fbff;
}

.book h3{
  color:#07549b;
  margin-bottom:8px;
}

.book button{
  margin-top:5px;
}

#namePage,
#booksPage,
#tokenPage,
#statusPage{
  display:none;
}

.status{
  background:#e9fff3;
  color:#087443;
  padding:20px;
  border-radius:15px;
  line-height:1.7;
  font-weight:bold;
}

.error{
  background:#ffecec;
  color:#c62828;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.small{
  margin-top:15px;
  font-size:13px;
  color:#777;
}

.signout{
  background:#555;
  margin-top:18px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="page" id="loginPage">
  <div class="box">
    <h1>Manan360.pk</h1>
    <p>Login to continue</p>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginError"></div>
  </div>
</div>


<!-- NAME -->
<div class="page" id="namePage">
  <div class="box">
    <h2>Welcome</h2>
    <p>What is your name?</p>

    <input id="visitorName" type="text" placeholder="Enter your name">

    <button onclick="saveName()">Continue</button>
  </div>
</div>


<!-- BOOKS -->
<div class="page" id="booksPage">
  <div class="box">
    <h2 id="welcomeText">Books</h2>

    <div class="book">
      <h3>Class 9th Notes</h3>
      <p>Study notes and test material</p>
      <button onclick="openToken()">Open Book</button>
    </div>

    <div class="book">
      <h3>Class 10th Notes</h3>
      <p>Study notes and test material</p>
      <button onclick="openToken()">Open Book</button>
    </div>

    <button class="signout" onclick="signOut()">Sign Out</button>
  </div>
</div>


<!-- TOKEN -->
<div class="page" id="tokenPage">
  <div class="box">
    <h2>Token Number</h2>
    <p>Enter your token number</p>

    <input
      id="token"
      type="text"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter Token Number">

    <button onclick="submitToken()">Submit</button>

    <div id="tokenError"></div>

    <button class="signout" onclick="signOut()">Sign Out</button>
  </div>
</div>


<!-- STATUS -->
<div class="page" id="statusPage">
  <div class="box">
    <h2>Application Status</h2>

    <div class="status">
      Application Submitted, please wait.<br><br>
      Status: Answered
    </div>

    <button class="signout" onclick="signOut()">Sign Out</button>
  </div>
</div>


<script>

/* Demo login accounts */
const accounts = {
  "admin": "1234",
  "manan": "1234",
  "user": "1234"
};


/* 500 test tokens */
const tokens = new Set();

/* آپ کا مخصوص token */
tokens.add("7842306159");

/* باقی unique tokens */
for(let i=6001; i<=6499; i++){
  tokens.add("784230" + i);
}


/* Page control */
function showPage(id){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("namePage").style.display="none";
  document.getElementById("booksPage").style.display="none";
  document.getElementById("tokenPage").style.display="none";
  document.getElementById("statusPage").style.display="none";

  document.getElementById(id).style.display="flex";
}


/* Login */
function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(accounts[username] &&
     accounts[username] === password){

    document.getElementById("loginError").innerHTML="";

    showPage("namePage");

  }else{

    document.getElementById("loginError").innerHTML=
      '<div class="error">Invalid username or password.</div>';

  }
}


/* Name */
function saveName(){

  const name =
    document.getElementById("visitorName").value.trim();

  if(name===""){
    alert("Please enter your name.");
    return;
  }

  localStorage.setItem("manan_name",name);

  document.getElementById("welcomeText").innerText=
    "Hello, " + name;

  showPage("booksPage");
}


/* Books → Token */
function openToken(){
  showPage("tokenPage");
}


/* Token submit */
function submitToken(){

  const token =
    document.getElementById("token").value.trim();

  const error =
    document.getElementById("tokenError");

  error.innerHTML="";

  if(token===""){
    error.innerHTML=
      '<div class="error">Please enter your token number.</div>';
    return;
  }

  if(tokens.has(token)){

    showPage("statusPage");

  }else{

    error.innerHTML=
      '<div class="error">Invalid Token.</div>';

  }
}


/* Sign Out */
function signOut(){

  localStorage.removeItem("manan_name");

  document.getElementById("username").value="";
  document.getElementById("password").value="";
  document.getElementById("visitorName").value="";
  document.getElementById("token").value="";

  showPage("loginPage");
}


/* Start */
showPage("loginPage");

</script>

</body>
</html>
