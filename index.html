<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manan360.pk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#061a40,#007bff,#00b894);
}

.page{
display:none;
min-height:100vh;
align-items:center;
justify-content:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#fff;
border-radius:22px;
padding:28px 22px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1,h2{
color:#064b91;
margin-bottom:12px;
}

p{
color:#555;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
font-size:16px;
border:1px solid #ccc;
border-radius:12px;
margin-bottom:12px;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
font-size:16px;
font-weight:bold;
color:white;
background:#087bea;
margin-top:9px;
cursor:pointer;
}

.green{background:#00a86b}
.gray{background:#777}
.dark{background:#444}

.book{
border:1px solid #ddd;
border-radius:15px;
padding:18px;
margin:12px 0;
background:#f5faff;
}

.book h3{
color:#07549b;
margin-bottom:7px;
}

.error{
margin-top:15px;
padding:13px;
border-radius:10px;
background:#ffe8e8;
color:#c62828;
font-weight:bold;
}

.tick{
font-size:90px;
font-weight:bold;
color:#08a65a;
line-height:1;
}

.success{
margin-top:15px;
padding:20px;
border-radius:15px;
background:#e9fff2;
color:#087443;
font-size:18px;
font-weight:bold;
line-height:1.7;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="page" id="loginPage">
<div class="box">

<h1>Manan360.pk</h1>
<p>Login to continue</p>

<input id="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="loginError"></div>

</div>
</div>


<!-- NAME PAGE -->
<div class="page" id="namePage">
<div class="box">

<h2>Welcome</h2>
<p>What is your name?</p>

<input id="visitorName" type="text" placeholder="Enter your name">

<button onclick="saveName()">Continue</button>

</div>
</div>


<!-- HOME PAGE -->
<div class="page" id="homePage">
<div class="box">

<h1 id="helloName">Welcome</h1>

<p>Welcome to Manan360.pk</p>

<button onclick="openBooks()">Books & Notes</button>

<button class="green" onclick="openTokenPage()">
Token Number
</button>

<button class="dark" onclick="signOut()">
Sign Out
</button>

</div>
</div>


<!-- BOOKS PAGE -->
<div class="page" id="booksPage">
<div class="box">

<h2>Books & Notes</h2>

<div class="book">
<h3>Class 9th Notes</h3>
<p>Study Notes</p>
<button onclick="openTokenPage()">Open Notes</button>
</div>

<div class="book">
<h3>Class 10th Notes</h3>
<p>Study Notes</p>
<button onclick="openTokenPage()">Open Notes</button>
</div>

<button class="gray" onclick="goHome()">
Home
</button>

</div>
</div>


<!-- SEPARATE TOKEN PAGE -->
<div class="page" id="tokenPage">
<div class="box">

<h2>Token Number</h2>

<p>Enter your token number</p>

<input
id="token"
type="text"
inputmode="numeric"
maxlength="10"
placeholder="Enter Token Number">

<button onclick="verifyToken()">
Verify Token
</button>

<button class="gray" onclick="cancelToken()">
Cancel
</button>

<div id="tokenMessage"></div>

</div>
</div>


<!-- SUCCESS PAGE -->
<div class="page" id="successPage">
<div class="box">

<div class="tick">✓</div>

<div class="success">
آپ کی درخواست سبمٹ ہو چکی ہے۔<br>
براہ کرم انتظار کریں۔
</div>

<button class="green" onclick="goHome()">
Home
</button>

</div>
</div>


<script>

/* LOGIN DETAILS */
const USERNAME = "admin1234";
const PASSWORD = "admin";


/* 500 VALID TOKENS */
const validTokens = new Set();

/* مخصوص token */
validTokens.add("7842306159");

/* باقی 499 tokens */
for(let i=6001;i<=6499;i++){
validTokens.add("784230"+i);
}


/* PAGE SYSTEM */
function showPage(id){

document.querySelectorAll(".page").forEach(function(page){
page.style.display="none";
});

document.getElementById(id).style.display="flex";
}


/* LOGIN */
function login(){

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value;

if(u===USERNAME && p===PASSWORD){

document.getElementById("loginError").innerHTML="";
showPage("namePage");

}else{

document.getElementById("loginError").innerHTML=
'<div class="error">Invalid username or password.</div>';

}
}


/* NAME */
function saveName(){

let name=document.getElementById("visitorName").value.trim();

if(name===""){
alert("Please enter your name.");
return;
}

document.getElementById("helloName").innerText=
"Hello, "+name;

showPage("homePage");
}


/* HOME → BOOKS */
function openBooks(){
showPage("booksPage");
}


/* HOME/BOOKS → SEPARATE TOKEN PAGE */
function openTokenPage(){

document.getElementById("token").value="";
document.getElementById("tokenMessage").innerHTML="";

showPage("tokenPage");
}


/* TOKEN VERIFY */
function verifyToken(){

let token=document.getElementById("token").value.trim();

let message=document.getElementById("tokenMessage");

if(token===""){

message.innerHTML=
'<div class="error">Please enter a token number.</div>';

return;
}

if(validTokens.has(token)){

showPage("successPage");

}else{

message.innerHTML=
'<div class="error">Invalid Token Number</div>';

}
}


/* CANCEL → HOME */
function cancelToken(){

document.getElementById("token").value="";
document.getElementById("tokenMessage").innerHTML="";

showPage("homePage");
}


/* HOME */
function goHome(){
showPage("homePage");
}


/* SIGN OUT */
function signOut(){

document.getElementById("username").value="";
document.getElementById("password").value="";
document.getElementById("visitorName").value="";
document.getElementById("token").value="";

showPage("loginPage");
}


/* START */
showPage("loginPage");

</script>

</body>
</html>
